# TradeChain console — the single UI served by nginx.
#
#   docker compose up --build      →  http://localhost:8080/ui/index.html
#
# The page opens pre-set to the verified Sepolia deployment. Transactions need a
# wallet in the browser (import the role accounts you use for the demo); reads
# work without one.
services:
  console:
    build: ./ui
    image: tradechain-console
    container_name: tradechain-console
    ports:
      - "8080:80"
    restart: unless-stopped
