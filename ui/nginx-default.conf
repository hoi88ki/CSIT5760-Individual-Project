server {
    listen 80;
    root /usr/share/nginx/html;

    location / {    
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 302 /ui/index.html;
    }
    
    location /ui/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        index index.html;
    }


}
